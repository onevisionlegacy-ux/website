<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Vision Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary-red: #ff1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 18px 0;
            transition: all 0.4s ease;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .navbar.scrolled {
            background: rgba(0, 0, 0, 0.98);
            padding: 14px 0;
            box-shadow: 0 10px 30px rgba(255, 142, 142, 0.451);
        }
        .nav-container {
            width: min(1100px, 92vw);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo img {
            width: 150px;
            height: auto;
        }
        .menu {
            display: flex;
            gap: 24px;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
            font-size: 14.5px;
            font-weight: 500;
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        .menu a:hover {
            opacity: 1;
            color: var(--primary-red);
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }
        .hamburger span {
            width: 28px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        .mobile-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.98);
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .mobile-menu.show {
            display: block;
        }
        .mobile-menu a {
            display: block;
            padding: 16px 5%;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        /* ==================== FOOTER ==================== */
        .footer {
            margin-top: 80px;
            padding: 60px 24px 40px;
            background: #050505;
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        .footer-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }
        .footer-brand img {
            width: 170px;
            height: auto;
        }
        .footer-social {
            display: flex;
            justify-content: center;
        }
        .social-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .join-btn {
            background: var(--primary-red);
            color: #fff;
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .join-btn:hover {
            transform: translateY(-3px);
            opacity: 0.95;
        }
        .social-links {
            display: flex;
            gap: 12px;
        }
        .social-link {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            text-decoration: none;
            border: 1.5px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            font-size: 18px;
        }
        .social-link:hover {
            border-color: var(--primary-red);
            background: rgba(255, 26, 26, 0.15);
            transform: translateY(-4px);
            color: var(--primary-red);
        }
        .footer-note {
            width: 100%;
            text-align: center;
            margin-top: 30px;
            color: #aaa;
            font-size: 13.5px;
        }

        /* Responsive */
        @media (max-width: 868px) {
            .menu { display: none; }
            .hamburger { display: flex; }
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="homepage.html"><img src="logo.png" alt="One Vision Legacy"></a>
            </div>
            <div class="menu">
                <a href="aboutus.html">About Us</a>
                <a href="culture.html">Culture</a>
                <a href="services.html">Services</a>
                <a href="career.html">Career</a>
                <a href="news.html">News</a>
                <a href="contactus.html">Contact Us</a>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="aboutus.html">Team</a>
            <a href="services.html">Services</a>
            <a href="career.html">Career</a>
            <a href="news.html">News</a>
            <a href="contactus.html">Contact Us</a>
        </div>
    </nav>

    <!-- BLANK CONTENT AREA -->
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 80px;">
        <h2 style="font-size: 2.5rem; text-align: center; color: #aaa;">
            Blank Page<br>
            <span style="font-size: 1.1rem; opacity: 0.7;">Ready for new content</span>
        </h2>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <a href="index.html"><img src="logo.png" alt="One Vision Legacy Logo"></a>
            </div>
            <div class="footer-social">
                <div class="social-group">
                    <a href="contactus.html" class="join-btn">Join Us</a>
                    <div class="social-links">
                        <a href="https://www.instagram.com/" target="_blank" class="social-link"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://www.facebook.com/" target="_blank" class="social-link"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="mailto:info@onevisionlegacy.com" class="social-link"><i class="fa-regular fa-envelope"></i></a>
                        <a href="https://maps.google.com/?q=One+Vision+Legacy" target="_blank" class="social-link"><i class="fa-solid fa-location-dot"></i></a>
                        <a href="https://www.tiktok.com/" target="_blank" class="social-link"><i class="fa-brands fa-tiktok"></i></a>
                    </div>
                </div>
            </div>
            <p class="footer-note">Powered by One Vision Legacy © 2026</p>
        </div>
    </footer>

    <script>
        // Navbar Scroll Effect
        const navbar = document.getElementById("navbar");
        window.addEventListener("scroll", () => {
            navbar.classList.toggle("scrolled", window.scrollY > 80);
        });

        // Hamburger Menu
        const hamburger = document.getElementById("hamburger");
        const mobileMenu = document.getElementById("mobileMenu");

        hamburger.addEventListener("click", () => {
            mobileMenu.classList.toggle("show");
            const spans = hamburger.querySelectorAll("span");
            if (mobileMenu.classList.contains("show")) {
                spans[0].style.transform = "rotate(45deg) translate(6px, 6px)";
                spans[1].style.opacity = "0";
                spans[2].style.transform = "rotate(-45deg) translate(5px, -5px)";
            } else {
                spans.forEach(span => { 
                    span.style.transform = "none"; 
                    span.style.opacity = "1"; 
                });
            }
        });
    </script>
</body>
